<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleCalc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons-grid">
            <!-- Digits -->
            <button id="btn-7" data-type="digit" data-value="7">7</button>
            <button id="btn-8" data-type="digit" data-value="8">8</button>
            <button id="btn-9" data-type="digit" data-value="9">9</button>
            <button id="btn-4" data-type="digit" data-value="4">4</button>
            <button id="btn-5" data-type="digit" data-value="5">5</button>
            <button id="btn-6" data-type="digit" data-value="6">6</button>
            <button id="btn-1" data-type="digit" data-value="1">1</button>
            <button id="btn-2" data-type="digit" data-value="2">2</button>
            <button id="btn-3" data-type="digit" data-value="3">3</button>
            <button id="btn-0" data-type="digit" data-value="0">0</button>
            <!-- Operators -->
            <button id="btn-plus" data-type="operator" data-value="+">+</button>
            <button id="btn-minus" data-type="operator" data-value="-">-</button>
            <button id="btn-multiply" data-type="operator" data-value="*">*</button>
            <button id="btn-divide" data-type="operator" data-value="/">/</button>
            <!-- Clear -->
            <button id="btn-clear" data-type="clear" data-value="C">C</button>
            <!-- Equals -->
            <button id="btn-equals" data-type="equals" data-value="=">=</button>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
